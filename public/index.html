<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Provider Benchmarks</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Chart.js and date adapter for time series -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>
<body>
<header class="dashboard-header">
    <h1>LLM Inference Provider Benchmarks</h1>
    <p class="subtitle">Comparing latency, throughput (TPS), and pricing across LLM inference providers.</p>
</header>

<main class="dashboard-container">
    <!-- Charts Grid -->
    <section class="charts-grid">
        <!-- Chart 1: Latency Over Time -->
        <div class="chart-card full-width">
            <h2>1. First Response Latency Over Time</h2>
            <div class="chart-wrapper">
                <canvas id="latencyChart"></canvas>
            </div>
        </div>

        <!-- Chart 2: Averaged Throughput (TPS) -->
        <div class="chart-card half-width">
            <h2>2. Averaged Throughput (TPS)</h2>
            <div class="chart-wrapper">
                <canvas id="throughputChart"></canvas>
            </div>
        </div>

        <!-- Chart 3: Throughput per Dollar -->
        <div class="chart-card half-width">
            <h2>3. Throughput per Dollar (Cost Efficiency)</h2>
            <div class="chart-wrapper">
                <canvas id="scatterChart"></canvas>
            </div>
        </div>
    </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
